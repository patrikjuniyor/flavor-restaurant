<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
	<!--
		Placeholder for demo art that is not installed.

		The sellable theme ships without the 12 MB demo pack, so any section
		that would point at a missing photograph points here instead. A 404
		in an <img> renders as a broken-image icon; this renders as a calm
		empty plate. It is 700 bytes, inlined by nothing, and cached forever.
	-->
