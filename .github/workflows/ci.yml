name: Flavor Platform CI Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-backend-tests:
    name: Backend Unit & Integration Tests (PHP 8.1 / 8.2 / 8.3 / 8.4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, sqlite3, pdo_sqlite, curl, json, openssl
          coverage: none

      - name: PHP Syntax Check (Lint)
        run: |
          find flavor-core/ flavor/ flavor-child/ tests/ -name "*.php" -exec php -l {} \;

      - name: Run Theme Chrome & Manifest Tests (colors, icons, PWA)
        run: |
          php tests/theme/test-theme-meta.php

      - name: Run theme.json Contract Tests (editor tokens match the skin)
        run: |
          php tests/theme/test-theme-json.php

      - name: Run Premium Parity Tests (night scheme, wishlist, mega menu, commerce extras)
        run: |
          php tests/theme/test-premium-features.php

      - name: Run Header & Footer Builder Contract Tests (chrome settings drive real markup)
        run: |
          php tests/theme/test-chrome-builder.php

      - name: Run Pure Logic Regression Suite (Jalali, tokens, RTL text)
        run: |
          php flavor-core/tests/run-pure-tests.php

      - name: Run Phase 1 & Phase 2 Integration Tests
        run: |
          php flavor-core/tests/run-e2e-integration.php

  motion-layer-guard:
    name: Motion Layer Guard (all twelve demos, no browser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Motion Layer (skins, keyframes, reduced motion, gating, enqueue)
        run: |
          node tests/ui/motion.mjs

  flutter-mobile-ci:
    name: Mobile Quality & Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test White-Label Provisioning Script
        run: |
          python3 mobile/scripts/provision_brand.py --mobile-root mobile

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile
        run: flutter test --coverage

  security-scan:
    name: Security & IDOR Regression Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, curl, json

      - name: Run Security IDOR Isolation Tests
        run: |
          php flavor-core/tests/run-e2e-integration.php

  i18n-guard:
    name: Translation Catalog Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          tools: composer:v2

      - name: Verify catalogs parse as valid gettext
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          msgfmt --check -o /dev/null flavor/languages/flavor.pot
          msgfmt --check -o /dev/null flavor-core/languages/flavor-core.pot

      - name: Verify catalogs are up to date with the source
        run: |
          php dev-tools/build-pot.php
          # The generator is deterministic apart from POT-Creation-Date, so a
          # drift shows up as a diff in the message entries.
          git diff --ignore-matching-lines='POT-Creation-Date' --exit-code -- \
            flavor/languages/flavor.pot flavor-core/languages/flavor-core.pot \
            || {
              echo "::error::Translation catalogs are stale. Run 'php dev-tools/build-pot.php' and commit the result."
              exit 1
            }

  release-hygiene:
    name: Version & Compatibility Headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json

      - name: Assert version headers agree with each other
        run: php dev-tools/check-versions.php

  coding-standards:
    name: WordPress Coding Standards (report)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          tools: composer:v2
          coverage: none

      - name: Install standards
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Report WordPress Coding Standards violations
        run: vendor/bin/phpcs --report=summary --report-file=phpcs-report.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: phpcs-report.txt
          if-no-files-found: ignore
