name: Flavor Platform CI Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-backend-tests:
    name: Backend Unit & Integration Tests (PHP 8.1 / 8.2 / 8.3 / 8.4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, sqlite3, pdo_sqlite, curl, json, openssl, sodium, zip
          coverage: none

      - name: PHP Syntax Check (Lint)
        run: |
          find flavor-core/ flavor/ flavor-child/ tests/ -name "*.php" -exec php -l {} \;

      - name: Run Theme Chrome & Manifest Tests (colors, icons, PWA)
        run: |
          php tests/theme/test-theme-meta.php

      - name: Run theme.json Contract Tests (editor tokens match the skin)
        run: |
          php tests/theme/test-theme-json.php

      - name: Run Block Pattern Contract Tests (markup, palette, spacing)
        run: |
          php tests/theme/test-block-patterns.php

      - name: Run Elementor Widget Contract Tests (registration, escaping, markup)
        run: |
          php tests/theme/test-elementor-widgets.php

      - name: Run Typography Contract Tests (type scale, sanitizer parity)
        run: |
          php tests/theme/test-typography.php

      - name: Run Per-Page Options Tests (sanitizing, CSS breakout, metabox)
        run: |
          php tests/theme/test-page-options.php

      - name: Run Preset Picker Tests (swatch/token parity, non-destructive clear)
        run: |
          php tests/theme/test-preset-control.php

      - name: Run Contrast Report Tests (WCAG values, PHP/JS formula parity)
        run: |
          php tests/theme/test-contrast.php

      - name: Run Repeater Tests (hostile JSON, migration, fallback, row markup)
        run: |
          php tests/theme/test-repeater.php

      - name: Run Live Preview Coverage Tests (strategy per setting, PHP/JS parity)
        run: |
          php tests/theme/test-live-preview.php

      # A readme tag the code does not honour is a claim that survived
      # because nothing checked it. full-site-editing was one: the theme
      # is classic PHP and had no templates/ at all.
      - name: Every readme tag is backed by code that exists
        run: php tests/theme/test-distribution.php

      # The explicit steps above are historical; the last phases proved some
      # suites (claims, nonce-coverage, …) never got an explicit step and thus
      # never ran here. This glob is the standing net: no tests/theme file may
      # be absent from CI. New suites are picked up automatically.
      - name: Run the whole theme suite (standing net for every test file)
        run: ./dev-tools/run-theme-tests.sh

      - name: Check every theme class is loaded before it is used
        run: |
          php dev-tools/check-class-wiring.php

      - name: Run Template Tag Tests (multi-byte safety, both substr paths)
        run: |
          php tests/theme/test-template-tags.php

      - name: Check the child theme stays in step with the parent
        run: |
          ./dev-tools/check-child-theme.sh

      - name: Run Premium Parity Tests (night scheme, wishlist, mega menu, commerce extras)
        run: |
          php tests/theme/test-premium-features.php

      - name: Run Header & Footer Builder Contract Tests (chrome settings drive real markup)
        run: |
          php tests/theme/test-chrome-builder.php

      # M-06: the stub suites never built a page, so nothing proved the cart
      # and checkout screens receive the checkout sheet. This one does.
      - name: Run Cart & Checkout Asset Tests (page state drives enqueued sheets)
        run: |
          php tests/theme/test-cart-checkout-assets.php

      # M-04: the signed update channel. Verifies signatures, manifest rules,
      # zip-slip checks, backup/rollback, and the release tool round trip.
      - name: Run Update Channel Tests (signatures, manifest, package, rollback)
        run: |
          php tests/theme/test-update-channel.php

      - name: Run Release Tooling Tests (keygen guards, sign/verify, release-site contents)
        run: |
          php tests/theme/test-release-tooling.php

      - name: Run Pure Logic Regression Suite (Jalali, tokens, RTL text)
        run: |
          php flavor-core/tests/run-pure-tests.php

      - name: Run Phase 1 & Phase 2 Integration Tests
        run: |
          php flavor-core/tests/run-e2e-integration.php

  motion-layer-guard:
    name: Motion Layer Guard (all twelve demos, no browser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Motion Layer (skins, keyframes, reduced motion, gating, enqueue)
        run: |
          node tests/ui/motion.mjs
          node tests/ui/digits.mjs

  elementor-visual-guard:
    name: Elementor Template Visual Guard (3 templates x 2 schemes x 3 widths, Chromium)
    runs-on: ubuntu-latest
    needs: motion-layer-guard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Playwright and Chromium
        run: |
          cd tests/ui
          npm ci
          npx playwright install --with-deps chromium

      - name: Render the shipped templates and measure them
        run: node tests/ui/elementor-visual.mjs --regen

      - name: Upload the screenshots when the guard fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: elementor-visual-screenshots
          path: .cache/ui-qa/elementor/
          if-no-files-found: ignore

  flutter-mobile-ci:
    name: Mobile Quality & Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test White-Label Provisioning Script
        run: |
          python3 mobile/scripts/provision_brand.py --mobile-root mobile

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile
        run: flutter test --coverage

  security-scan:
    name: Security & IDOR Regression Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, curl, json

      - name: Run Security IDOR Isolation Tests
        run: |
          php flavor-core/tests/run-e2e-integration.php
          php flavor-core/tests/run-branch-scope-guards.php

      - name: Refuse live credential patterns in full history (R3-12)
        run: |
          set -eu
          git fetch --no-rebase --unshallow origin main >/dev/null 2>&1 || true
          hits=$(git log -p --all | grep -iE 'ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|AKIA[0-9A-Z]{16}' | grep -viE 'xxx+' || true)
          if [ -n "$hits" ]; then
            echo "Credential-shaped strings found in history; see below. Revoke them, then clean or amend:" >&2
            printf '%s\n' "$hits" | head -10 >&2
            exit 1
          fi
          echo "history is clean of credential patterns (docs placeholders like ghp_xxxx are exempt)"

  i18n-guard:
    name: Translation catalogues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install gettext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext

      # Supersedes the two steps this job used to run. check-i18n.sh covers
      # both and adds the checks that matter for a catalogue with real
      # translations: msgfmt --strict on every .po (a dropped %s or a wrong
      # plural count is a runtime bug, not a build one), .po drift, and a
      # compiled .mo beside every .po.
      - name: Guard the translation catalogues
        run: |
          ./dev-tools/check-i18n.sh

      - name: Run Translation Contract Tests (mo loads, placeholders survive)
        run: |
          php tests/theme/test-translation.php

      # The translation key IS the Persian source text, so a typo in a source
      # string is a typo in the catalogue key too and no amount of translating
      # fixes it. This blocks the classes that were actually found in review:
      # Arabic ي/ك inside Persian copy, a stray «título», a space before «،».
      - name: Persian string hygiene (source text the catalogue keys derive from)
        run: |
          python3 dev-tools/i18n/scan-persian-typos.py

  release-hygiene:
    name: Version & Compatibility Headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json

      - name: Assert version headers agree with each other
        run: php dev-tools/check-versions.php

      # Completion is promised in three places at once: the status file, the
      # generated checklist, and the stamps written into the prompt collection
      # itself (its owner reads progress there, not in chat). A phase that was
      # finished but never reported is how a 108-item list drifts back into
      # "we think most of it is done", so the three must agree on every push.
      - name: Prompt progress is reported where it is read
        run: |
          python3 dev-tools/build-progress.py \
            --prompts docs/prompts/flavor-restaurant-fix-prompts.txt \
            --status dev-tools/progress-status.json
          python3 dev-tools/annotate-prompts.py \
            --prompts docs/prompts/flavor-restaurant-fix-prompts.txt \
            --status dev-tools/progress-status.json \
            --check
          git diff --exit-code -- docs/PROMPT-PROGRESS.md docs/prompts/flavor-restaurant-fix-prompts.txt

  coding-standards:
    name: WordPress Coding Standards (report)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          tools: composer:v2
          coverage: none

      - name: Install standards
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Report WordPress Coding Standards violations
        run: vendor/bin/phpcs --report=summary --report-file=phpcs-report.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: phpcs-report.txt
          if-no-files-found: ignore

  real-wordpress:
    name: Real WordPress 7.1 + WooCommerce 11 + Elementor 4.3.4
    runs-on: ubuntu-latest
    # The WordPress/WooCommerce compatibility claim and the Elementor control
    # contract are only true while this job is green. This installs the versions
    # the theme advertises plus the pinned Elementor release, which catches both
    # theme boot errors and controls that an offline stand-in cannot validate.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flavor_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, intl, zip, gd
          coverage: none

      - name: Install WordPress
        run: |
          curl -sS -o /tmp/wp.tar.gz https://wordpress.org/latest.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp
          mv /tmp/wordpress "$RUNNER_TEMP/wordpress"

      - name: Install WP-CLI
        run: |
          curl -sS -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp

      - name: Configure WordPress
        run: |
          cd "$RUNNER_TEMP/wordpress"
          wp config create --allow-root \
            --dbname=flavor_ci --dbuser=root --dbpass=root --dbhost=127.0.0.1 --dbprefix=wp_ \
            --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          define( 'WP_DEBUG_LOG', true );
          PHP

      - name: Install WordPress core
        run: |
          cd "$RUNNER_TEMP/wordpress"
          wp core install --allow-root \
            --url=http://localhost:8080 \
            --title="Flavor CI" \
            --admin_user=admin --admin_email=admin@example.test --admin_password=ci-password

      - name: Put the theme and plugin in place
        run: |
          rm -rf "$RUNNER_TEMP/wordpress/wp-content/themes/flavor"
          rm -rf "$RUNNER_TEMP/wordpress/wp-content/plugins/flavor-core"
          cp -r flavor "$RUNNER_TEMP/wordpress/wp-content/themes/flavor"
          cp -r flavor-core "$RUNNER_TEMP/wordpress/wp-content/plugins/flavor-core"

      - name: Install WooCommerce 11.0.1
        run: |
          cd "$RUNNER_TEMP/wordpress"
          curl -sS -L --fail -o "$RUNNER_TEMP/woocommerce-11.0.1.zip" https://downloads.wordpress.org/plugin/woocommerce.11.0.1.zip
          wp plugin install "$RUNNER_TEMP/woocommerce-11.0.1.zip" --activate --allow-root

      - name: Install Elementor 4.3.4
        run: |
          cd "$RUNNER_TEMP/wordpress"
          curl -sS -L --fail -o "$RUNNER_TEMP/elementor-4.3.4.zip" https://downloads.wordpress.org/plugin/elementor.4.3.4.zip
          wp plugin install "$RUNNER_TEMP/elementor-4.3.4.zip" --activate --allow-root

      - name: Activate the theme and Flavor Core
        run: |
          cd "$RUNNER_TEMP/wordpress"
          wp theme activate flavor --allow-root
          wp plugin activate flavor-core --allow-root

      - name: Verify the versions actually installed
        run: |
          cd "$RUNNER_TEMP/wordpress"
          wp core version --allow-root
          wp plugin get woocommerce --field=version --allow-root
          wp plugin get elementor --field=version --allow-root

      - name: Run the real WordPress smoke test (demo pack installed)
        run: |
          php tests/integration/real-wp-smoke.php --wp="$RUNNER_TEMP/wordpress"

      # Stub controls cannot validate Elementor's real control stack or CSS
      # compiler. Exercise registration, responsive Style controls, the three
      # shipped templates, and all seventeen widgets on real Elementor instead.
      - name: Run the real Elementor widgets and template smoke test
        run: |
          php tests/integration/real-elementor-smoke.php --wp="$RUNNER_TEMP/wordpress"

      # The sellable theme ships without the 12 MB demo pack. That state
      # has to boot too, and it is the one customers actually get, so it
      # is tested rather than assumed.
      - name: Run the smoke test again with the demo pack removed
        run: |
          rm -rf "$RUNNER_TEMP/wordpress/wp-content/themes/flavor/demos"
          php tests/integration/real-wp-smoke.php --wp="$RUNNER_TEMP/wordpress"

      # Registration proves nothing about execution: a route can be
      # registered, reviewed and shipped while fataling the first time
      # anyone calls it. This dispatches a real request at every one.
      - name: Dispatch a request at every registered REST route
        run: |
          php tests/integration/real-rest-smoke.php --wp="$RUNNER_TEMP/wordpress"

      # The Customizer reference is generated from the live registration,
      # so it is only trustworthy while it matches the code. A control added
      # without regenerating the table fails here, not in a reader's head.
      - name: The Customizer reference matches the registered controls
        run: |
          wp eval-file dev-tools/docs/export-customizer-reference.php --path="$RUNNER_TEMP/wordpress" --allow-root
          git diff --exit-code -- docs/fa/08-jadval-kontrol-ha.md

      - name: Confirm no fatal was logged in either state
        run: |
          log="$RUNNER_TEMP/wordpress/wp-content/debug.log"
          if [ -f "$log" ] && grep -qi "fatal" "$log"; then
            echo "fatal errors were logged:"
            grep -i "fatal" "$log"
            exit 1
          fi
          echo "no fatal errors in either state"

  distribution-weight:
    name: Distribution weight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Build the sellable theme and the separate demo pack
        run: ./dev-tools/build-distribution.sh

      - name: Report the two artefacts
        run: |
          echo "=== What a customer downloads ==="
          for f in dist/*.zip; do
            printf '%-28s %s KB\n' "$(basename "$f")" "$(du -k "$f" | cut -f1)"
          done

      - name: The packless theme must actually boot
        run: |
          # The split is only an improvement if the theme survives it.
          # Unzip the sellable artefact and confirm it has no demos/ and
          # still contains the placeholder the code falls back to.
          mkdir -p /tmp/packless
          unzip -q dist/flavor.zip -d /tmp/packless
          test ! -d /tmp/packless/flavor/demos
          test -f /tmp/packless/flavor/assets/img/demo-placeholder.svg
          test -f /tmp/packless/flavor/style.css
          test -f /tmp/packless/flavor/functions.php
          echo "packless theme is complete and demo-free"
