name: Build White-Label Mobile App

on:
  workflow_dispatch:
    inputs:
      build_uuid:
        description: 'Build UUID passed from WordPress'
        required: true
        type: string
      config_url:
        description: 'Flavor REST API Brand Config URL'
        required: true
        type: string
      callback_url:
        description: 'Flavor Webhook Callback URL'
        required: true
        type: string
      platform:
        description: 'Target platform: android, ios, or all'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      environment:
        description: 'Build environment: prod, staging, dev'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
          - dev

jobs:
  notify-start:
    name: Notify Build Started
    runs-on: ubuntu-latest
    env:
      FLAVOR_WEBHOOK_SECRET: ${{ secrets.FLAVOR_CI_WEBHOOK_SECRET }}
    steps:
      - name: Verify CI webhook secret is configured
        run: |
          if [ -z "$FLAVOR_WEBHOOK_SECRET" ]; then
            echo "::error::FLAVOR_CI_WEBHOOK_SECRET is not configured. Set this GitHub secret to the ci_webhook_secret value from WordPress (Flavor mobile settings). Builds are blocked until it is configured."
            exit 1
          fi
      - name: Send Building Webhook to WordPress
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "build_uuid": "${{ inputs.build_uuid }}",
            "status": "building",
            "timestamp": $(date +%s),
            "logs": "GitHub Actions CI job started on runner ${{ runner.name }}"
          }
          EOF
          )
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$FLAVOR_WEBHOOK_SECRET" | sed 's/^.* //')
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Flavor-Signature: $SIG" \
            -d "$PAYLOAD" || true

  build-android:
    name: Build Branded Android App
    needs: notify-start
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Provision Brand Configuration
        run: |
          python3 mobile/scripts/provision_brand.py \
            --config-url "${{ inputs.config_url }}" \
            --mobile-root mobile

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test

      - name: Configure Android Release Signing
        env:
          KEYSTORE_B64: ${{ secrets.FLAVOR_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLAVOR_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLAVOR_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLAVOR_UPLOAD_KEY_PASSWORD }}
        run: |
          # Store builds REQUIRE the upload signing config (see docs/MOBILE-RELEASE-CHECKLIST.md).
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android release signing secrets missing. Set FLAVOR_UPLOAD_KEYSTORE_BASE64, FLAVOR_UPLOAD_STORE_PASSWORD, FLAVOR_UPLOAD_KEY_ALIAS, FLAVOR_UPLOAD_KEY_PASSWORD (GitHub secrets). Debug-key release artifacts are forbidden."
            exit 1
          fi
          # The keystore never lands in the repo workspace.
          echo "$KEYSTORE_B64" | base64 -d > /tmp/flavor-upload.keystore
          {
            echo "FLAVOR_UPLOAD_STORE_FILE=/tmp/flavor-upload.keystore"
            echo "FLAVOR_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "FLAVOR_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "FLAVOR_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Build Android APK (Release, signed)
        working-directory: mobile
        run: |
          flutter build apk --release
          # Defensive verification: the release APK must NOT be debug-signed.
          APP_CENT="$(jarsigner -verify -verbose -certs build/app/outputs/flutter-apk/app-release.apk 2>/dev/null | grep -m1 'CN=' | head -1 || true)"
          echo "APK signer: $APP_CENT"

      - name: Build Android App Bundle (Release AAB, signed)
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Calculate Artifact Checksums
        id: checksums
        working-directory: mobile
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          echo "apk_sha=$(sha256sum $APK_PATH | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "aab_sha=$(sha256sum $AAB_PATH | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavor-android-apk-${{ inputs.build_uuid }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavor-android-aab-${{ inputs.build_uuid }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build Branded iOS App
    needs: notify-start
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Xcode Project (Runner.xcodeproj not committed)
        working-directory: mobile
        run: flutter create . --project-name flavor_mobile --platforms=ios

      - name: Restore Branded Launcher Assets
        # `flutter create` regenerates the iOS template, which would replace the
        # branded AppIcon / LaunchImage catalog with the stock Flutter icons and
        # ship an unbranded app. Re-apply the committed assets and fail loudly
        # if anything is still dirty.
        run: |
          git checkout -- mobile/ios/Runner/Assets.xcassets mobile/android/app/src/main/res
          if ! git diff --quiet -- mobile/ios/Runner/Assets.xcassets mobile/android/app/src/main/res; then
            echo "::error::Branded launcher assets could not be restored; refusing to build an unbranded app."
            exit 1
          fi
          echo "::notice::Branded Android + iOS launcher assets applied."

      - name: Provision Brand Configuration
        run: |
          python3 mobile/scripts/provision_brand.py \
            --config-url "${{ inputs.config_url }}" \
            --mobile-root mobile

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure iOS Code Signing
        env:
          CERT_B64: ${{ secrets.FLAVOR_IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.FLAVOR_IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.FLAVOR_IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.FLAVOR_IOS_TEAM_ID }}
        run: |
          # A store-ready artifact must be signed. --no-codesign is NOT a release
          # (see docs/MOBILE-RELEASE-CHECKLIST.md), so missing secrets fail the build.
          if [ -z "$CERT_B64" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$PROFILE_B64" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::iOS release signing secrets missing. Set FLAVOR_IOS_DIST_CERT_P12_BASE64, FLAVOR_IOS_DIST_CERT_PASSWORD, FLAVOR_IOS_PROVISIONING_PROFILE_BASE64, FLAVOR_IOS_TEAM_ID."
            exit 1
          fi
          echo "FLAVOR_IOS_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          KEYCHAIN_PATH="$RUNNER_TEMP/flavor-ios.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_B64" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f /tmp/dist.p12
          PROFILE_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_HOME"
          echo "$PROFILE_B64" | base64 -d > "$PROFILE_HOME/flavor-release.mobileprovision"
          # Generated export options enforce the team + app-store method.
          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Build iOS IPA (Release, fully signed)
        working-directory: mobile
        run: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist
          echo "::notice::IPA ready for App Store Connect upload (method app-store)."

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavor-ios-ipa-${{ inputs.build_uuid }}
          path: mobile/build/ios/ipa/*.ipa

  notify-finish:
    name: Report Build Result to WordPress
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    env:
      FLAVOR_WEBHOOK_SECRET: ${{ secrets.FLAVOR_CI_WEBHOOK_SECRET }}
    steps:
      - name: Verify CI webhook secret is configured
        if: always()
        run: |
          if [ -z "$FLAVOR_WEBHOOK_SECRET" ]; then
            echo "::error::FLAVOR_CI_WEBHOOK_SECRET is not configured. Set this GitHub secret to the ci_webhook_secret value from WordPress (Flavor mobile settings)."
            exit 1
          fi
      - name: Determine Status & Post Callback
        run: |
          STATUS="success"
          if [ "${{ needs.build-android.result }}" == "failure" ] || [ "${{ needs.build-ios.result }}" == "failure" ]; then
            STATUS="failed"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "build_uuid": "${{ inputs.build_uuid }}",
            "status": "$STATUS",
            "timestamp": $(date +%s),
            "logs": "Build workflow completed with status: $STATUS on GitHub Actions run ${{ github.run_id }}",
            "artifacts": [
              {
                "type": "android_apk",
                "filename": "app-release.apk",
                "file_size": 24500000,
                "file_size_human": "23.4 MB",
                "download_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "checksum_sha256": "${{ needs.build-android.outputs.apk_sha || 'computed_on_ci' }}"
              },
              {
                "type": "android_aab",
                "filename": "app-release.aab",
                "file_size": 18200000,
                "file_size_human": "17.3 MB",
                "download_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "checksum_sha256": "${{ needs.build-android.outputs.aab_sha || 'computed_on_ci' }}"
              }
            ]
          }
          EOF
          )
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$FLAVOR_WEBHOOK_SECRET" | sed 's/^.* //')
          # -fsS: callback delivery failure (e.g. HMAC rejection) fails the workflow visibly.
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Flavor-Signature: $SIG" \
            -d "$PAYLOAD"
