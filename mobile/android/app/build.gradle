def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

def flutterRoot = localProperties.getProperty('flutter.sdk') ?: System.getenv('FLUTTER_ROOT')

// =========================================================================
// Release signing — resolved SECURELY, never from committed files:
//   1) env vars (CI): FLAVOR_UPLOAD_STORE_FILE, FLAVOR_UPLOAD_STORE_PASSWORD,
//      FLAVOR_UPLOAD_KEY_ALIAS, FLAVOR_UPLOAD_KEY_PASSWORD
//   2) local file: android/keystore.properties (git-ignored, dev machines only)
// A release build without credentials FAILS loudly instead of silently
// falling back to the debug key. See docs/MOBILE-RELEASE-CHECKLIST.md.
// =========================================================================
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withReader('UTF-8') { reader -> keystoreProps.load(reader) }
}

def resolveSigningProp = { String key ->
    def envVal = System.getenv("FLAVOR_UPLOAD_${key}")
    return envVal ? envVal : keystoreProps.getProperty(key)
}

def releaseStoreFile     = resolveSigningProp('STORE_FILE')
def releaseStorePassword = resolveSigningProp('STORE_PASSWORD')
def releaseKeyAlias      = resolveSigningProp('KEY_ALIAS')
def releaseKeyPassword   = resolveSigningProp('KEY_PASSWORD')
def releaseSigningConfigured = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.flavor.restaurant"
    compileSdkVersion 34
    ndkVersion "25.1.8937393"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.flavor.restaurant"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Never debug-sign store artifacts.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // Enforcing at execution time (not evaluation time) keeps IDE sync and
    // `flutter build apk --debug` credential-free while release FAILS LOUDLY.
    gradle.taskGraph.whenReady { graph ->
        def wantsRelease = graph.allTasks.any { it.path.startsWith(':app:') && it.path.contains('Release') }
        if (wantsRelease && !releaseSigningConfigured) {
            throw new GradleException(
                "Release builds require signing credentials. Provide FLAVOR_UPLOAD_STORE_FILE / " +
                "FLAVOR_UPLOAD_STORE_PASSWORD / FLAVOR_UPLOAD_KEY_ALIAS / FLAVOR_UPLOAD_KEY_PASSWORD " +
                "env vars (CI) or android/keystore.properties (local). Debug-key release artifacts " +
                "are forbidden. See docs/MOBILE-RELEASE-CHECKLIST.md.")
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
